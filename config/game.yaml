# Among Us Hide n Seek rules (PROJECT_PLAN.md section 3.7).
# Labels: "documented" = Innersloth announcement or community wiki;
# "undocumented default" = no published number, our own choice;
# "by eye" = chosen so matches look like Among Us, frozen and reported.

players:
  seekers: 1
  hiders: 3 # showcase plan: 3 hiders first, then 5 reusing the same role adapters

timers:
  hide_phase_s: 10 # undocumented default: seeker frozen at spawn while hiders scatter
  round_length_s: 300 # undocumented default: total match length (including hide phase)
  final_hide_s: 120 # documented: last part of the round
  final_hide_speed_multiplier: 1.5 # documented boost; exact multiplier not published
  ping_interval_s: 6 # documented: Final Hide pings reveal living hiders' locations

# Short preset for untrained demo matches and quick iteration. Select with --preset short.
presets:
  short:
    hide_phase_s: 5
    round_length_s: 90
    final_hide_s: 30

vents:
  max_uses_per_hider: 3 # undocumented default
  max_time_inside_s: 5 # undocumented default
  use_radius_units: 0.6 # by eye
  # Brains can't press "vent". An engineered auto-vent rule (disclosed) makes a hider
  # vent when it stands on a vent, has uses left, and the seeker is within this range.
  auto_vent_danger_range_units: 4.0

# Task rules are ambiguous across sources (see flyseek/world/skeld.py docstring).
tasks_enabled: false

speed:
  # Among Us map units match skeld_map.json. Crossing The Skeld (~41 units) takes
  # roughly 15-20 s at 1.0x, i.e. ~2-2.7 units/s. By eye; not measured from the game.
  hider_units_per_s: 2.0
  seeker_units_per_s: 2.0

kill_radius_units: 0.6 # by eye
body_radius_units: 0.25 # by eye

vision:
  hider_range_units: 6.0 # by eye (radial vision, flashlight mode off)
  seeker_range_units: 6.0 # by eye

danger_meter:
  max_range_units: 8.0 # undocumented default: meter starts filling inside this distance

flashlight_mode: false # documented alternative setting; not modeled yet

# Engineered reflexes for brain-driven flies (disclosed in every replay's metadata).
reflexes:
  # A brain fly that touches a wall turns by a random angle. Without it, untrained
  # flies with constant forward speed pin themselves into corners. Phase 4 training
  # is meant to make it unnecessary; matches report whether it was on.
  wall_bump_turn: true
  wall_bump_turn_deg: [60, 150]
