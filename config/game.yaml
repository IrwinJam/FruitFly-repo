# Among Us Hide n Seek rules, as far as they're documented (PROJECT_PLAN.md
# section 3.7). Values marked "documented" come from Innersloth's own announcement
# or the community wiki; values marked "undocumented default" are our own choice
# because no source gives a numeric default -- change these freely, they're just
# a reasonable starting point.

players:
  seekers: 1
  hiders: 5 # capped by GPU memory on the RTX 2060 Super, see docs/bench_results.json

timers:
  hide_phase_s: 90 # undocumented default: time hiders get to scatter before seeking starts
  round_length_s: 300 # undocumented default: total match length hiders must survive
  final_hide_s: 120 # documented (Innersloth announcement / community wiki)
  final_hide_speed_multiplier: 1.5 # documented: seeker gets a speed boost in Final Hide; exact multiplier not published, using a plausible value
  ping_interval_s: 6 # documented: Final Hide pings reveal all living hiders' locations, default ~6s

vents:
  max_uses_per_hider: 3 # undocumented default
  max_time_inside_s: 5 # undocumented default

# Hide n Seek's task rules are ambiguous across sources -- see the docstring in
# flyseek/world/skeld.py for the two conflicting descriptions found during
# research. Defaulting to disabled (the simpler, unambiguous ruleset); no task
# stations are modeled in skeld_extras.json.
tasks_enabled: false

speed:
  base_units_per_s: null # not measured yet -- Among Us speed is host-configurable 0.5x-3.0x of an internal base; calibrate against skeld_map.json's world-unit scale once the kinematic body (flyseek/motors/body_kinematic.py) exists

danger_meter:
  max_range_units: 8.0 # undocumented default: distance at which the danger meter starts filling

flashlight_mode: false # radial vision by default; cone vision is a documented alternative setting
